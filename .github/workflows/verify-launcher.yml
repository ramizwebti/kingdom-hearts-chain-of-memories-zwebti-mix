name: "Kingdom Hearts Chain of Memories: Zwebti Mix - Windows launcher checks"
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings migration on Windows PowerShell
        shell: powershell
        run: ./port/tools/test_native_presentation.ps1
      - name: Check release installation and rollback
        shell: powershell
        run: ./launcher/tests/test-release-store.ps1
