name: Verify Windows launcher
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings migration on Windows PowerShell
        shell: powershell
        run: ./port/tools/test_native_presentation.ps1
      - name: Check release installation and rollback
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /out:build/ReleaseStoreTests.exe /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll launcher/ReleaseStore.cs launcher/tests/ReleaseStoreTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/ReleaseStoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
